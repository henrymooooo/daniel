[package]
name = "desk-media-companion"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_System_Com",
] }
